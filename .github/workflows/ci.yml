name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # From .nvmrc, so the version lives in one place. The app needs
          # Node 22: the room store and the ERP are built on node:sqlite,
          # which arrived in 22.5 and does not exist before it.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Closes the gap between "the fix is on main" and "the fix is live", which
  # is where three separate fixes sat while the running container was older.
  #
  # Setup, once:
  #   secrets.RAILWAY_TOKEN   a Railway *project* token — Project Settings ->
  #                           Tokens. Scoped to one environment, so the CLI
  #                           needs no `railway link`. An account token will
  #                           not do: it needs --project as well.
  #   vars.RAILWAY_SERVICE    the service name, when the project has more than
  #                           one. Omit it and Railway picks.
  #   vars.HEALTH_URL         e.g. https://your-host/api/health, to verify the
  #                           commit actually came up. Omit it and the deploy
  #                           still runs, unverified.
  #
  # Without the token this job says so and passes, rather than going red on
  # every push until somebody adds it.
  deploy:
    name: Deploy to Railway
    # Never from a pull request: a fork's PR must not be able to deploy, and
    # `needs` alone would not stop it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # One deploy at a time, and never cancelled half way: killing `railway up`
    # mid-build leaves the service on whatever it was, which is a worse place
    # to be than a queue.
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Is there a token?
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No RAILWAY_TOKEN secret, so nothing was deployed. Add a project token to deploy on every push to main."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc

      - name: Install the Railway CLI
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm install -g "@railway/cli@^4"
          railway --version

      # Runtime environment, not a build argument: Railway sets
      # RAILWAY_GIT_COMMIT_SHA only on a deploy it triggered from the connected
      # repository, and this is not one of those. Without it /api/health can
      # only answer `source: "none"`.
      #
      # Best effort on purpose. A CLI that has moved this flag around must not
      # be able to stop a deploy over a field that is only ever read by a
      # health check — the verification below is what notices, and says so.
      - name: Tell the service which commit this is
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          set -uo pipefail
          args=()
          if [ -n "${SERVICE:-}" ]; then args+=(--service "$SERVICE"); fi
          railway variables --set "GIT_SHA=$GITHUB_SHA" --skip-deploys "${args[@]}" \
            || railway variables --set "GIT_SHA=$GITHUB_SHA" "${args[@]}" \
            || echo "::warning::Could not set GIT_SHA on the service; /api/health will report source=none."

      - name: Deploy
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SERVICE:-}" ]; then args+=(--service "$SERVICE"); fi
          # No --detach: the build runs on Railway, and a failed build has to
          # fail this job rather than being reported as a successful deploy.
          railway up "${args[@]}"

      # The deploy step succeeding means Railway accepted the image and built
      # it. This is the step that means the commit is actually answering
      # requests, which is the whole reason /api/health reports a sha.
      #
      # A script rather than bash around `jq`: the runner has jq today, and
      # `jq -r '.commit' 2>/dev/null || echo null` reads a missing jq as "the
      # commit is not live yet" — so an image that dropped it would poll for
      # ten minutes and then report a deploy failure that had not happened.
      - name: Wait for the commit to answer
        if: steps.gate.outputs.skip == 'false' && vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: node scripts/await-deploy.mjs "$HEALTH_URL" "$GITHUB_SHA"

      - name: Say what to do about an unverified deploy
        if: steps.gate.outputs.skip == 'false' && vars.HEALTH_URL == ''
        run: echo "::notice::Deployed, but not verified. Set a HEALTH_URL repository variable (e.g. https://your-host/api/health) to have CI wait for the commit to answer."
