name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # From .nvmrc, so the version lives in one place. The app needs
          # Node 22: the room store and the ERP are built on node:sqlite,
          # which arrived in 22.5 and does not exist before it.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Railway deploys this repository itself, on every push to main. CI cannot
  # gate that — the push has already happened by the time these checks run —
  # so this job does not deploy anything. It reports whether the commit
  # actually reached production, which is the part nothing else could answer.
  #
  # Gating a deploy on the checks would mean CI owning the deploy instead,
  # which is a different trade: it would also mean two things deploying the
  # same service.
  #
  # Needs one repository variable, or it is skipped:
  #   vars.HEALTH_URL   e.g. https://your-host/api/health
  #
  # Deliberately not `needs: build`. Railway deploys whether or not the checks
  # pass, so what is live is worth reporting either way — and starting at the
  # same time as them means the poll is running while the container swaps.
  verify-deploy:
    name: Verify the deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Two pushes in quick succession: the older poll is waiting for a commit
    # that has already been superseded and would fail on the timeout. Safe to
    # cancel, unlike a deploy — nothing is half done.
    concurrency:
      group: verify-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # A script rather than bash around `jq`, and not for tidiness: the
      # runner has jq today, and `jq -r '.commit' 2>/dev/null || echo null`
      # reads a *missing* jq as "the commit is not live yet" — so an image
      # that dropped it would poll for ten minutes and then report a failure
      # that had not happened.
      - name: Wait for the commit to answer
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: node scripts/await-deploy.mjs "$HEALTH_URL" "$GITHUB_SHA"
